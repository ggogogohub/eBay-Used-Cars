<div class="toast-container position-fixed top-0 end-0 p-3">
  @for (toast of toasts; track toast.id) {
    <div class="toast show fade-in" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header {{getToastClass(toast.type)}}">
        <i class="bi {{getToastIcon(toast.type)}} me-2"></i>
        <strong class="me-auto">
          @switch (toast.type) {
            @case ('success') {
              Success
            }
            @case ('error') {
              Error
            }
            @case ('warning') {
              Warning
            }
            @case ('info') {
              Information
            }
            @default {
              Notification
            }
          }
        </strong>
        <button type="button" class="btn-close" (click)="removeToast(toast.id)" aria-label="Close"></button>
      </div>
      <div class="toast-body">
        {{toast.message}}
      </div>
    </div>
  }
</div>
