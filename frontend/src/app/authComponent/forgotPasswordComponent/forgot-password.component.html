<div class="auth-container">
  <!-- Animated Background Elements -->
  <div class="bg-element bg-element-1"></div>
  <div class="bg-element bg-element-2"></div>
  <div class="bg-element bg-element-3"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="bi bi-key-fill"></i>
      </div>
      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-subtitle">Reset your account password</p>
    </div>

    <div class="auth-body">
      <!-- Success Message -->
      <div class="alert alert-success" *ngIf="successMessage">
        <i class="bi bi-check-circle-fill"></i>
        {{ successMessage }}
      </div>

      <!-- Error Message -->
      <div class="alert alert-danger" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {{ errorMessage }}
      </div>

      <!-- Form -->
      <form (ngSubmit)="requestPasswordReset()" *ngIf="!successMessage">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email address"
            required
          >
          <div class="form-text">
            We'll send a password reset link to this email address.
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="isLoading"
        >
          <div *ngIf="isLoading" class="spinner"></div>
          <span>Send Reset Link</span>
        </button>
      </form>

      <!-- After Success -->
      <div *ngIf="successMessage" class="text-center mt-3">
        <p class="text-light">Check your email for the password reset link.</p>
      </div>
    </div>

    <div class="auth-footer">
      <a routerLink="/auth" class="btn btn-link">
        Back to Login
      </a>
    </div>
  </div>
</div>
