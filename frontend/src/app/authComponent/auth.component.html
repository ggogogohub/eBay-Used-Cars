<div class="auth-container">
  <!-- Animated Background Elements -->
  <div class="bg-element bg-element-1"></div>
  <div class="bg-element bg-element-2"></div>
  <div class="bg-element bg-element-3"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="bi bi-car-front-fill"></i>
      </div>
      <h1 class="auth-title">{{ isLoginMode ? 'Welcome Back' : 'Join Us' }}</h1>
      <p class="auth-subtitle">{{ isLoginMode ? 'Sign in to your account' : 'Create a new account' }}</p>
    </div>

    <div class="auth-body">
      <!-- Alert Messages -->
      <div class="alert alert-danger" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {{ errorMessage }}
      </div>

      <div class="alert alert-success" *ngIf="successMessage">
        <i class="bi bi-check-circle-fill"></i>
        {{ successMessage }}
      </div>

      <!-- Login Form -->
      <form *ngIf="isLoginMode" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="loginUsername" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="loginUsername"
            [(ngModel)]="loginData.username"
            name="username"
            placeholder="Enter your username"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="password-input-container">
            <input
              [type]="showLoginPassword ? 'text' : 'password'"
              class="form-control"
              id="loginPassword"
              [(ngModel)]="loginData.password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button
              type="button"
              class="password-toggle-btn"
              (click)="showLoginPassword = !showLoginPassword"
              [attr.aria-label]="showLoginPassword ? 'Hide password' : 'Show password'"
            >
              <i class="bi" [ngClass]="showLoginPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>
          <a routerLink="/forgot-password" class="forgot-password">Forgot Password?</a>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="isLoading"
        >
          <div *ngIf="isLoading" class="spinner"></div>
          <span>Sign In</span>
        </button>

        <div class="divider">or continue with</div>

        <div class="social-buttons">
          <button type="button" class="btn btn-social btn-google" (click)="loginWithGoogle()">
            <i class="bi bi-google"></i>
            <span>Google</span>
          </button>
        </div>
      </form>

      <!-- Register Form -->
      <form *ngIf="!isLoginMode" (ngSubmit)="onRegister()">
        <div class="form-group">
          <label for="registerUsername" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="registerUsername"
            [(ngModel)]="registerData.username"
            name="username"
            placeholder="Choose a username"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="registerPassword" class="form-label">Password</label>
          <div class="password-input-container">
            <input
              [type]="showRegisterPassword ? 'text' : 'password'"
              class="form-control"
              id="registerPassword"
              [(ngModel)]="registerData.password"
              name="password"
              placeholder="Create a password"
              required
              autocomplete="new-password"
            >
            <button
              type="button"
              class="password-toggle-btn"
              (click)="showRegisterPassword = !showRegisterPassword"
              [attr.aria-label]="showRegisterPassword ? 'Hide password' : 'Show password'"
            >
              <i class="bi" [ngClass]="showRegisterPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="registerRole" class="form-label">Account Type</label>
          <select
            class="form-select"
            id="registerRole"
            [(ngModel)]="registerData.role"
            name="role"
          >
            <option value="buyer">Buyer</option>
            <option value="seller">Seller</option>
          </select>
          <div class="form-text">
            Buyers can browse and review listings. Sellers can also create listings.
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="isLoading"
        >
          <div *ngIf="isLoading" class="spinner"></div>
          <span>Create Account</span>
        </button>

        <div class="divider">or register with</div>

        <div class="social-buttons">
          <button type="button" class="btn btn-social btn-google" (click)="loginWithGoogle()">
            <i class="bi bi-google"></i>
            <span>Google</span>
          </button>
        </div>
      </form>
    </div>

    <div class="auth-footer">
      <button class="btn btn-link" (click)="toggleMode()">
        {{ isLoginMode ? 'Need an account? Create one' : 'Already have an account? Sign in' }}
      </button>
    </div>
  </div>
</div>
