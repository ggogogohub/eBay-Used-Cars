<div class="container mt-5 pt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h2 class="h4 mb-0">Reset Password</h2>
        </div>
        <div class="card-body">
          <!-- Loading State -->
          <div *ngIf="isVerifying" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Verifying your reset link...</p>
          </div>

          <!-- Success Message -->
          <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
            <div class="mt-2">
              <p>Redirecting to login page in 3 seconds...</p>
              <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="width: 100%"></div>
              </div>
            </div>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
            <div *ngIf="!isTokenValid" class="mt-2">
              <a routerLink="/forgot-password" class="btn btn-outline-primary btn-sm">Request New Reset Link</a>
            </div>
          </div>

          <!-- Reset Password Form -->
          <form (ngSubmit)="resetPassword()" *ngIf="isTokenValid && !isVerifying && !successMessage">
            <div class="mb-3">
              <label for="password" class="form-label">New Password</label>
              <div class="input-group">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control"
                  id="password"
                  name="password"
                  [(ngModel)]="password"
                  placeholder="Enter your new password"
                  required
                >
                <button
                  type="button"
                  class="btn btn-outline-secondary password-toggle"
                  (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                >
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                </button>
              </div>
              <div class="form-text">
                Password must be at least 8 characters long.
              </div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <div class="input-group">
                <input
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  class="form-control"
                  id="confirmPassword"
                  name="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  placeholder="Confirm your new password"
                  required
                >
                <button
                  type="button"
                  class="btn btn-outline-secondary password-toggle"
                  (click)="showConfirmPassword = !showConfirmPassword"
                  [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
                >
                  <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                </button>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="isLoading"
              >
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Reset Password
              </button>
              <a routerLink="/login" class="btn btn-outline-secondary">Back to Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
